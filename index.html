<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Blog</title>
        <style>
            header {
                background-color: rgb(0, 0, 0);
                color: #FFFFFF;
                text-align: center;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                border: 5px solid 
                #2c2c2c
            }
            main {
                background-color: 
                #FFFFFF;
                color: #1a0000;
                max-width: 800px;
                margin: 0 auto;
                padding: 16px;
                display: flex;
            }
            img {
                width: 90px;
                height: 90px;
            }
            .artigo-autor {
                font-weight: bold;
            }
        </style>
    </head>
    <body>
        <header>
            <h1>MEU BLOG TECH</h1>
            <p>Vou compartilhar conhecimentos sobre tecnologia, 
            programação e curiosidades</p>
        </header>
        <main>
            <img src="https://tse3.mm.bing.net/th/id/OIP.JTk2Vzx_LmJgc15hXE0nawHaFo?r=0&rs=1&pid=ImgDetMain&o=7&rm=3" alt="Messi humilhando o cristiano">
            <div>
                <h2>Meu Primeiro Post</h2>
                <p class="artigo-autor">Por: Kaleb Araujo Ribeiro</p>
                <p>Boas-Vindas ao meu novo blog! Aqui Vou
                compartilhar dicas de programação e curiosidades
                da area da tecnologia.</p>
                <button>❤️ <span>0</span></button>
                <button>👍 <span>0</span></button>
            </div>
        </main>
    </body>
<script>
    const botao = document.querySelectorAll("button");
    botao.addEventListener("click", botaoClicado);

    function botaoClicado(){
        console.log("fui clicado");
        let texto = botao.querySelector("span");
        texto.textContent++;
    }

</script>   
</html>
